# Worker I/O Server: Tác vụ mạng/API nhẹ (Kịch bản LLM, Giọng đọc TTS, Google Drive)
name: crt-worker-io

services:
  worker-io-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8101 --reload
    environment:
      WORKER_NAME: worker-io-1
      REDIS_URL: redis://${MAIN_HOST:-host.docker.internal}:6379/0
      MAIN_API_URL: http://${MAIN_HOST:-host.docker.internal}:8000
    volumes:
      - ./app:/srv/worker-io/app
    ports:
      - "8101:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker-io-celery:
    build: .
    command: celery -A app.tasks.celery_app worker -Q io_queue -c 8 -n worker_io@%h -l info
    environment:
      WORKER_NAME: worker-io-1
      REDIS_URL: redis://${MAIN_HOST:-host.docker.internal}:6379/0
      MAIN_API_URL: http://${MAIN_HOST:-host.docker.internal}:8000
    volumes:
      - ./app:/srv/worker-io/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

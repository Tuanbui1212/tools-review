# Worker server: chạy tách khỏi Main (D045). Kết nối tới Redis, API, MinIO của Main.
# Muốn thêm worker: chạy thêm bản sao `celery-worker` (docker compose up --scale celery-worker=3)
# hoặc dựng compose này trên một máy khác.
name: crt-worker

x-worker: &worker
  build: .
  environment:
    WORKER_NAME: ${WORKER_NAME:-worker-1}
    REDIS_URL: redis://${MAIN_HOST:-host.docker.internal}:6379/0
    MAIN_API_URL: http://${MAIN_HOST:-host.docker.internal}:8000
    S3_ENDPOINT_URL: http://${MAIN_HOST:-host.docker.internal}:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-crt-minio}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-crt-minio-secret}
    S3_BUCKET: ${S3_BUCKET:-crt-files}
  volumes:
    - ./app:/srv/worker/app
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  worker-api:
    <<: *worker
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    ports:
      - "8100:8100"

  celery-worker:
    <<: *worker
    command: celery -A app.tasks.celery_app worker -Q ai,files,notify -l info

  celery-beat:
    <<: *worker
    command: celery -A app.tasks.celery_app beat -l info

  flower:
    <<: *worker
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
